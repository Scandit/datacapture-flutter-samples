name: BarcodeSelectionSettingsSample
description: Demonstrates how you can adapt the barcode selection settings best to your needs and experiment with all the options.

publish_to: 'none'

version: 1.0.0

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  scandit_flutter_datacapture_barcode:
    '>=8.6.1 <8.6.2'
  permission_handler: 12.0.3

flutter:
  config:
    enable-swift-package-manager: true
  uses-material-design: true

