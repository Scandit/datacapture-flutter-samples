name: BarcodeSelectionSimpleSample
description: Basic sample to show the minimum code needed to use the Barcode Selection API

publish_to: 'none'

version: 1.0.0

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  scandit_flutter_datacapture_barcode:
    '>=8.5.1 <8.5.2'
  permission_handler: 12.0.1

flutter:
  config:
    enable-swift-package-manager: true
  uses-material-design: true
