name: IdCaptureExtendedSample
description: A more advanced ID Capture setup.

publish_to: 'none'

version: 1.0.0

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  scandit_flutter_datacapture_id:
    '>=8.6.0 <8.6.1'
  permission_handler: 12.0.3
  intl: ^0.20.2

flutter:
  config:
    enable-swift-package-manager: true
  uses-material-design: true
  assets:
    - assets/images/ic_barcode.png
    - assets/images/ic_mrz.png
    - assets/images/ic_viz.png
