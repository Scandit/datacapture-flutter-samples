name: USDLVerificationSample
description: A basic ID Scanning sample that demonstrates the workflow for US Drivers' License Capture and Verification.

publish_to: 'none'

version: 1.0.0

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  scandit_flutter_datacapture_id:
    '>=8.6.1 <8.6.2'
  scandit_flutter_datacapture_id_aamva_barcode_verification:
    '>=8.6.1 <8.6.2'
  permission_handler: 12.0.3
  intl: ^0.20.2

flutter:
  config:
    enable-swift-package-manager: true
  uses-material-design: true

